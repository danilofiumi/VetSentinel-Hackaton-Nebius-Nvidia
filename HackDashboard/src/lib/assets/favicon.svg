<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b241e" />
      <stop offset="40%" stop-color="#061713" />
      <stop offset="100%" stop-color="#020a08" />
    </linearGradient>

    <!-- Medical Cross Gradient -->
    <linearGradient id="vs-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15" />
    </linearGradient>

    <!-- Lifeline Glow Filter -->
    <filter id="vs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Container matching VetSentinel rounded-2xl -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="8"
    fill="url(#vs-bg)"
    stroke="#10b981"
    stroke-opacity="0.5"
    stroke-width="1.2"
  />

  <!-- Medical Cross Background -->
  <path
    d="M13 5h6v7h7v6h-7v9h-6v-9H6v-6h7V5z"
    fill="url(#vs-cross)"
    stroke="#10b981"
    stroke-opacity="0.55"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Central Heartbeat / Lifeline Trace -->
  <path
    d="M5 16h6l2.5-5 3.5 10 2.5-6 1.5 2 6-1"
    fill="none"
    stroke="#10b981"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#vs-glow)"
  />
  <path
    d="M5 16h6l2.5-5 3.5 10 2.5-6 1.5 2 6-1"
    fill="none"
    stroke="#a7f3d0"
    stroke-width="1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Protective Veterinary Paw Elements -->
  <circle cx="16" cy="19.5" r="2.2" fill="#10b981" />
  <circle cx="12.5" cy="16.5" r="1.3" fill="#34d399" />
  <circle cx="19.5" cy="16.5" r="1.3" fill="#34d399" />
  <circle cx="10.5" cy="19" r="1.1" fill="#6ee7b7" />
  <circle cx="21.5" cy="19" r="1.1" fill="#6ee7b7" />

  <!-- Active Telemetry Pulse Ring -->
  <circle cx="26" cy="26" r="3.2" fill="#10b981" fill-opacity="0.3" />
  <circle cx="26" cy="26" r="1.8" fill="#22c55e" stroke="#041815" stroke-width="0.8" />
</svg>