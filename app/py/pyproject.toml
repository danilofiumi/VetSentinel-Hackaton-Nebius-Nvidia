[tool.poetry]
name = "vetsentinel-backend"
version = "0.1.0"
description = "VetSentinel - Backend Pipeline with Nebius Token Factory and Tavily Specialist on Dagu"
authors = ["Danilo Fiumi"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28.1"
pydantic = "^2.10.6"
python-dotenv = "^1.0.1"
rich = "^13.9.4"
pyyaml = "^6.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
